<meta charset="utf-8">
<title>Efectos de flujo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: cabecera + 4 celulares interactivos (G1–G4) en rejilla, cada uno con su lista de efectos; los celulares tienen su propia estética fija */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --s2:#ECEEF3; --fg:#15161A; --fg2:#5C5F6A; --bd:#E1E3EA; --focus:#4F55E8;
  --f-body:"Plus Jakarta Sans",system-ui,sans-serif; --f-serif:"Instrument Serif",Georgia,serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1); --std:cubic-bezier(.2,0,0,1); --io:cubic-bezier(.65,0,.25,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0F13;--surface:#17181D;--s2:#22242B;--fg:#F2F3F5;--fg2:#A1A4AE;--bd:#2B2D35;--focus:#8B90FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0F13;--surface:#17181D;--s2:#22242B;--fg:#F2F3F5;--fg2:#A1A4AE;--bd:#2B2D35;--focus:#8B90FF;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
.lede{color:var(--fg2);max-width:72ch;margin:8px 0 0}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tile{background:var(--surface);border:1px solid var(--bd);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.stage{background:var(--s2);margin:12px;border-radius:16px;padding:20px 0 14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.meta{padding:2px 18px 18px;display:flex;flex-direction:column;gap:8px}
.meta h2{margin:0;font-size:18px;font-weight:800;display:flex;gap:8px;align-items:baseline}
.meta h2 span{font:500 12px var(--f-mono);color:var(--fg2)}
.meta p{margin:0;color:var(--fg2);font-size:13.5px}
.fxl{display:flex;flex-wrap:wrap;gap:5px}
.fxl code{font:500 11px var(--f-mono);background:var(--s2);padding:3px 7px;border-radius:6px}
.restart{border:1px solid var(--bd);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:12px;cursor:pointer}

/* ===== Motor común ===== */
.ph{position:relative;width:272px;max-width:100%;height:568px;border-radius:42px;border:6px solid #0B0D12;overflow:clip;isolation:isolate;box-shadow:0 24px 50px rgb(10 14 30/.28);font-size:12.5px;line-height:1.4}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:76px;height:21px;border-radius:12px;background:#05060A;z-index:40}
.st{position:absolute;inset:0;padding:46px 20px 22px;display:flex;flex-direction:column;opacity:0;filter:blur(12px);transform:scale(1.03);pointer-events:none;transition:opacity 520ms var(--std),filter 520ms var(--std),transform 620ms var(--std)}
.st.on{opacity:1;filter:none;transform:none;pointer-events:auto}
.st.out{opacity:0;filter:blur(12px);transform:scale(.97)}
/* texto que aparece palabra por palabra desde el desenfoque */
.rv .w{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(6px);transition:opacity 500ms var(--std),filter 500ms var(--std),transform 600ms var(--spring),color 900ms}
.st.on .rv .w{opacity:1;filter:none;transform:none;transition-delay:calc(var(--d,0ms) + var(--i)*70ms)}
.rv.dim .w{color:var(--dimc,#6B6F7B)}
.st.on .rv.dim .w{color:inherit;transition-delay:calc(var(--d,0ms) + var(--i)*70ms),calc(var(--d,0ms) + var(--i)*70ms),calc(var(--d,0ms) + var(--i)*70ms),calc(var(--d,0ms) + 600ms + var(--i)*70ms)}
.fade{opacity:0;transform:translateY(10px);transition:opacity 500ms var(--std),transform 600ms var(--spring)}
.st.on .fade{opacity:1;transform:none;transition-delay:var(--d,0ms)}
/* botón que se habilita */
.cta{height:46px;border-radius:999px;border:0;font:800 13.5px var(--f-body);cursor:pointer;transition:background-color 450ms var(--std),color 450ms,transform 120ms,opacity 300ms}
.cta:active{transform:scale(.97)}
.cta.dis{pointer-events:none}
/* toque discreto */
.tap{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:1.5px solid var(--tapc,rgb(255 255 255/.55));background:color-mix(in srgb,var(--tapc,#fff) 10%,transparent);pointer-events:none;z-index:50;animation:tap 420ms var(--std) forwards}
@keyframes tap{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.dots{display:flex;gap:5px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:9px;background:currentColor;opacity:.25;transition:width 400ms var(--spring),opacity 300ms}
.dots i.on{width:18px;opacity:.9}

/* ===== G1 · Onboarding oscuro ===== */
.g1{background:#0B0C10;color:#F4F5F7;--tapc:rgb(255 255 255/.55)}
.g1 .cta{background:#2A2C33;color:#6B6F7B}
.g1 .cta.ok{background:#F4F5F7;color:#0B0C10}
.g1 .skip{position:absolute;top:44px;right:18px;font-size:11px;color:#9EA2AD;font-weight:600}
.g1 h3{font-size:21px;line-height:1.2;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.g1 .sub{color:#9EA2AD;font-size:11.5px;margin:0}
.logo1{margin:auto;width:84px;height:84px}
.logo1 path{fill:transparent;stroke:#F4F5F7;stroke-width:2.2;stroke-dasharray:300;stroke-dashoffset:300}
.st.on .logo1 path{animation:l1draw 1100ms var(--io) forwards,l1fill 500ms 1000ms forwards}
.st.on .logo1{animation:l1out 600ms 1900ms var(--io) forwards}
@keyframes l1draw{to{stroke-dashoffset:0}}
@keyframes l1fill{to{fill:#F4F5F7}}
@keyframes l1out{to{transform:scale(.6);opacity:0}}
.cards{position:relative;height:200px;margin:26px 0 auto}
.cards i{position:absolute;left:50%;top:50%;width:170px;height:96px;margin:-48px 0 0 -85px;border-radius:18px;background:linear-gradient(160deg,#2B2D36,#1A1B22);border:1px solid rgb(255 255 255/.08);box-shadow:0 18px 30px rgb(0 0 0/.5);animation:float 4s ease-in-out infinite}
.cards i:nth-child(1){transform:translate(-26px,-30px) rotate(-8deg);opacity:.5;animation-delay:-1s}
.cards i:nth-child(2){transform:translate(24px,-14px) rotate(6deg);opacity:.75;animation-delay:-2s}
.cards i:nth-child(3){padding:14px;font-size:10px;color:#C9CCD4;line-height:1.35}
.cards i:nth-child(3) b{display:block;margin-top:14px;width:60%;height:6px;border-radius:9px;background:#3A3D47}
@keyframes float{50%{translate:0 -6px}}
.cluster{position:relative;height:190px;margin:22px 0 auto}
.cluster span{position:absolute;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;box-shadow:0 10px 20px rgb(0 0 0/.4);opacity:0;transform:scale(.3) translateY(14px)}
.st.on .cluster span{animation:pop1 620ms var(--spring) forwards;animation-delay:calc(var(--i)*80ms + 250ms)}
@keyframes pop1{to{opacity:1;transform:none}}
.cluster .n{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:var(--f-serif);font-size:20px}
.chart{margin:26px 0 auto;background:#15161C;border:1px solid rgb(255 255 255/.06);border-radius:18px;padding:14px}
.chart small{color:#9EA2AD;font-size:10px}
.chart b{display:block;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.chart svg{display:block;width:100%;height:90px;margin-top:6px}
.chart .ln{fill:none;stroke:#34D27B;stroke-width:2;stroke-dasharray:500;stroke-dashoffset:500}
.chart .ar{fill:url(#g1a);opacity:0}
.st.on .chart .ln{animation:l1draw 1400ms var(--io) 300ms forwards}
.st.on .chart .ar{animation:fadein 800ms 1200ms forwards}
@keyframes fadein{to{opacity:1}}
.pay{margin:12px 0 auto;display:flex;flex-direction:column;gap:9px}
.pay .hdr{text-align:center}
.pay .hdr b{font-size:20px;font-style:italic;font-family:var(--f-serif);font-weight:400}
.pick{position:relative}
.pick>button{width:100%;height:42px;border-radius:12px;border:1px solid rgb(255 255 255/.12);background:#17181E;color:#E9EAEE;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:600;font-size:12px;cursor:pointer}
.pick ul{position:absolute;left:-4px;right:-4px;top:48px;margin:0;padding:6px;list-style:none;border-radius:16px;background:rgb(40 42 50/.55);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgb(255 255 255/.14);box-shadow:0 20px 40px rgb(0 0 0/.5);transform-origin:50% 0;transform:scale(.85);opacity:0;pointer-events:none;transition:transform 380ms var(--spring),opacity 220ms;z-index:5}
.pick.open ul{transform:none;opacity:1;pointer-events:auto}
.pick li{padding:8px 10px;border-radius:10px;font-size:11.5px;cursor:pointer;color:#C9CCD4;display:flex;justify-content:space-between}
.pick li.sel{background:rgb(255 255 255/.12);color:#fff;font-weight:700}
.price{font-size:30px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.price small{font-size:12px;color:#9EA2AD;font-weight:600}
.feat{font-size:11px;color:#BFC2CA;display:flex;flex-direction:column;gap:5px}
.feat span::before{content:"✓  ";color:#34D27B;font-weight:800}

/* ===== G2 · Galería con profundidad ===== */
.g2{background:#120E12;color:#F6EFEA;--tapc:rgb(255 255 255/.55)}
.g2 .st{z-index:8}
.g2 .layer{position:absolute;inset:0;padding:44px 12px 20px;transition:transform 600ms var(--io),filter 600ms var(--io)}
.g2.deep .layer{transform:scale(1.1);filter:blur(3px) brightness(.55)}
.g2 .date{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px;font-weight:700;font-size:15px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gal button{height:124px;border:0;border-radius:16px;cursor:pointer;position:relative;overflow:hidden;transition:transform 150ms}
.gal button:active{transform:scale(.97)}
.gal button span{position:absolute;left:8px;bottom:6px;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgb(0 0 0/.4)}
.sheet2{position:absolute;left:8px;right:8px;bottom:8px;z-index:6;border-radius:28px;padding:22px 18px 16px;text-align:center;background:linear-gradient(180deg,rgb(60 40 45/.85),rgb(30 20 26/.95));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgb(255 255 255/.1);transform:translateY(110%);transition:transform 560ms var(--spring)}
.g2.deep .sheet2{transform:none}
.orb{width:42px;height:42px;border-radius:50%;margin:0 auto 10px;background:radial-gradient(circle at 40% 35%,#FFE3C7,#F58C6B 45%,#B4428A 80%);box-shadow:0 0 24px rgb(245 140 107/.6);animation:breath 2.4s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.08);filter:hue-rotate(-18deg) brightness(1.08)}}
.sheet2 h4{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.sheet2 small{display:block;color:#C9B9B4;font-size:10.5px;margin:6px 0 14px}
.g2 .cta{width:100%;background:rgb(255 255 255/.12);color:#fff;border:1px solid rgb(255 255 255/.18)}
.load{align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 45%,#3A2230,#120E12 70%)}
.shim{font-size:17px;font-weight:600;background:linear-gradient(90deg,#8C7F84 0%,#FFF 45%,#8C7F84 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.bigorb{width:150px;height:150px;border-radius:50%;margin:30px 0;background:radial-gradient(circle at 42% 38%,#FFE9D6,#F59A76 35%,#C9467F 68%,#5B2150 100%);box-shadow:0 0 60px rgb(245 140 107/.45),inset 0 0 30px rgb(255 255 255/.25);animation:breath 2.2s ease-in-out infinite}
.load .pill{font-size:10px;background:rgb(255 255 255/.1);border-radius:999px;padding:4px 10px;color:#E8D9D4}
.player{padding:44px 14px 20px;background:linear-gradient(180deg,#14202A,#1E1416)}
.player .top{display:flex;align-items:center;gap:10px;font-weight:700;font-size:12px;margin-bottom:12px}
.back2{width:30px;height:30px;border-radius:50%;border:0;background:rgb(255 255 255/.12);color:#fff;cursor:pointer}
.scene{height:300px;border-radius:22px;overflow:hidden;position:relative}
.scene i{position:absolute;inset:-6%;background:radial-gradient(ellipse 60% 30% at 50% 88%,#FF7A2F 0,transparent 70%),radial-gradient(circle at 70% 55%,#fff 0 9px,transparent 10px),linear-gradient(180deg,#3E86D1 0%,#8EC0EA 45%,#6FAF4F 62%,#3E7C2F 100%);filter:blur(18px);transform:scale(1.12)}
.st.on .scene i{animation:focus 1600ms var(--io) 200ms forwards,kb 9s ease-in-out 1.8s infinite alternate}
@keyframes focus{to{filter:blur(0);transform:scale(1.04)}}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.12) translate(-2%,-1%)}}
.prog{height:3px;background:rgb(255 255 255/.18);border-radius:9px;margin:14px 4px 10px;overflow:hidden}
.prog b{display:block;height:100%;width:0;background:#fff;border-radius:9px}
.st.on .prog b{animation:prog 8s linear 1.4s forwards}
@keyframes prog{to{width:100%}}
.ctl{display:flex;justify-content:center;gap:26px;font-size:16px;opacity:.85}

/* ===== G3 · Registro por pasos ===== */
.g3{background:#05070B;color:#F2F4F8;--tapc:rgb(255 255 255/.55)}
.g3::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 40% at 0% 100%,rgb(30 80 160/.45),transparent 70%),radial-gradient(ellipse 60% 35% at 100% 100%,rgb(190 30 40/.4),transparent 70%);z-index:0}
.g3 .st{z-index:1}
.g3 .cta{width:100%;background:#24262C;color:#6E7380}
.g3 .cta.ok{background:#F2F4F8;color:#05070B}
.splash3{align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#0E3A6E,#05070B 70%)}
.rings{position:absolute;left:50%;top:30%;width:0;height:0}
.rings i{position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;border:1.5px solid rgb(90 170 255/.5);opacity:0}
.st.on .rings i{animation:ring3 3.6s var(--std) infinite;animation-delay:calc(var(--i)*.9s + 1.2s)}
@keyframes ring3{0%{transform:scale(.6);opacity:.8}100%{transform:scale(7);opacity:0}}
.mark{position:relative;width:70px;height:70px;margin-top:-60px}
.mark i{position:absolute;width:30px;height:30px;border-radius:50% 50% 50% 10%;background:#F2F4F8;opacity:0}
.mark i:nth-child(1){left:6px;top:6px;transform:translate(-60px,-70px) rotate(-200deg)}
.mark i:nth-child(2){right:6px;top:18px;border-radius:50% 10% 50% 50%;transform:translate(70px,-40px) rotate(160deg)}
.mark i:nth-child(3){left:20px;bottom:4px;border-radius:10% 50% 50% 50%;transform:translate(-20px,80px) rotate(220deg)}
.st.on .mark i{animation:asm 900ms var(--spring) forwards;animation-delay:calc(var(--i)*90ms + 150ms)}
@keyframes asm{to{transform:none;opacity:1}}
.st.on .mark{animation:markup 700ms var(--io) 1300ms forwards}
@keyframes markup{to{transform:translateY(-70px) scale(.62)}}
.title3{font-size:34px;line-height:1.02;font-weight:800;text-align:center;letter-spacing:-.02em;margin-top:-30px;--d:1500ms}
.title3 .w:nth-child(3){color:#5AA9FF}
.logins{position:absolute;left:20px;right:20px;bottom:26px;display:flex;flex-direction:column;gap:7px}
.logins button{height:38px;border-radius:999px;border:0;font-weight:700;font-size:11.5px;cursor:pointer;background:rgb(255 255 255/.12);color:#fff;opacity:0;transform:translateY(20px)}
.logins button:first-child{background:#F2F4F8;color:#05070B}
.st.on .logins button{animation:up3 600ms var(--spring) forwards;animation-delay:calc(var(--i)*90ms + 2100ms)}
@keyframes up3{to{opacity:1;transform:none}}
.steps{display:flex;gap:5px;margin:2px 0 26px}
.steps i{flex:1;height:3px;border-radius:9px;background:rgb(255 255 255/.15);overflow:hidden;position:relative}
.steps i::after{content:"";position:absolute;inset:0;background:#F2F4F8;transform:scaleX(0);transform-origin:left;transition:transform 600ms var(--io)}
.steps i.f::after{transform:none}
.q3{font-size:12.5px;font-weight:700;margin-bottom:12px;position:relative;height:18px}
.q3 span{position:absolute;inset:0;transition:opacity 400ms,filter 400ms,transform 500ms var(--std)}
.q3 span.hid{opacity:0;filter:blur(8px);transform:translateY(-8px)}
.in3{position:relative;display:flex;align-items:center;gap:8px;border-bottom:1.5px solid rgb(255 255 255/.2);padding:8px 2px;transition:border-color 200ms}
.in3:focus-within{border-color:#F2F4F8}
.in3 input{flex:1;border:0;outline:none;background:none;color:#fff;font-size:15px;font-weight:600;min-width:0}
.in3 .ghost{position:absolute;left:2px;font-size:15px;font-weight:600;color:rgb(255 255 255/.25);pointer-events:none;transition:opacity 300ms}
.err3{color:#FF6B6B;font-size:10.5px;font-weight:600;height:0;opacity:0;overflow:hidden;transition:opacity 250ms,height 250ms;margin-top:6px}
.err3.show{height:16px;opacity:1}
.shake{animation:shk3 360ms var(--std)}
@keyframes shk3{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.chips3{display:flex;gap:6px;margin-top:14px}
.chips3 button{border:0;border-radius:999px;background:rgb(255 255 255/.1);color:#DDE1E8;font-size:10.5px;font-weight:600;padding:6px 10px;cursor:pointer}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.otp span{height:42px;border-radius:10px;border:1.5px solid rgb(255 255 255/.16);display:grid;place-items:center;font-size:17px;font-weight:700;transition:border-color 200ms,transform 250ms var(--spring),background 200ms}
.otp span.cur{border-color:#F2F4F8;box-shadow:0 0 0 3px rgb(255 255 255/.08)}
.otp span.fill{transform:scale(1.06);background:rgb(255 255 255/.06)}
.resend{font-size:10px;color:#8D93A0;text-align:center;margin:auto 0 8px}
.done3{align-items:center;justify-content:center;text-align:center}
.done3 b{font-size:28px;font-weight:800}

/* ===== G4 · Onboarding claro con red ===== */
.g4{background:#F3F6F5;color:#122420;--tapc:rgb(18 80 70/.45)}
.g4 .brand4{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:12px}
.g4 .brand4 i{width:14px;height:14px;border-radius:50%;border:2px solid #122420}
.g4 h3{font-family:var(--f-serif);font-weight:400;font-size:25px;line-height:1.1;text-align:center;margin:0 0 6px}
.g4 .sub{text-align:center;color:#5D6E6A;font-size:11px;margin:0}
.g4 .cta{width:100%;background:#123E38;color:#fff}
.g4 .dots{color:#123E38;margin:10px 0}
.birth{transform:scale(.55);opacity:0;transition:transform 900ms var(--io),opacity 500ms}
.st.on .birth{transform:none;opacity:1}
.net{position:relative;height:250px;margin:6px 0 4px}
.net svg{position:absolute;inset:0;width:100%;height:100%}
.net line{stroke:#9FB8B2;stroke-width:1;stroke-dasharray:120;stroke-dashoffset:120}
.st.on .net line{animation:l1draw 700ms var(--io) forwards;animation-delay:calc(var(--i)*90ms + 700ms)}
.node{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:12px;background:#123E38;color:#fff;display:grid;place-items:center;font-size:18px;z-index:2;animation:nodep 2s ease-in-out infinite}
@keyframes nodep{50%{box-shadow:0 0 0 8px rgb(18 62 56/.12)}}
.av{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid #fff;box-shadow:0 4px 10px rgb(0 0 0/.12);left:50%;top:50%;opacity:0;font-size:8.5px;font-weight:700;text-align:center}
.av b{position:absolute;top:31px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#3B4C48}
.st.on .av{animation:avout 700ms var(--spring) forwards;animation-delay:calc(var(--i)*90ms + 600ms)}
@keyframes avout{from{opacity:0;transform:translate(0,0) scale(.3)}to{opacity:1;transform:translate(var(--x),var(--y))}}
.morph{position:absolute;left:50%;top:50%;z-index:3;width:150px;height:28px;margin:-14px 0 0 -75px;border-radius:999px;background:#123E38;color:#fff;font-size:9.5px;display:flex;align-items:center;gap:6px;padding:0 10px;overflow:hidden;opacity:0;transform:scale(.6);transition:width 600ms var(--io),height 600ms var(--io),margin 600ms var(--io),border-radius 600ms var(--io),opacity 300ms,transform 400ms var(--spring)}
